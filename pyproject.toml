[project]
name = "pymolish"
readme = "README.md"
requires-python = ">=3.11"
dynamic=["version"]
license = "LicenseRef-Open-Source-PyMOL AND MIT"
license-files = ["LICENSE", "LICENSE-MIT"]
description = """
pymolish-studio. Contains PyMOL(TM) source code. \
A molecular viewer for proteins, small molecules, density, surfaces and \
trajectories, with molecular editing, ray tracing and movies. \
An independent fork of Open-Source PyMOL; not a Schrodinger product. \
PyMOL is a trademark of Schrodinger, LLC.\
"""
authors = [
  {name = "Schrodinger", email = "pymol-users@lists.sourceforge.net"},
  {name = "Adrian Jasinski"},
]
dependencies = [
  "numpy>=2.0",
  "PySide6>=6.12",
]

[build-system]
build-backend = "backend"
backend-path = ["_custom_build"]
requires = [
  "cmake>=3.13.3",
  "numpy>=2.0",
  "setuptools>=77.0.3",
]

[project.optional-dependencies]
dev = [
  "biopython==1.88",
  "msgpack==1.2.4",
  "pillow==13.0.0",
  "PySide6==6.12.0",
  "pyinstaller==6.22.3",
  "ruff==0.17.4",
  "pytest==9.0.3",
  "requests==2.33.0",
]

[project.urls]
Homepage = "https://github.com/adrian-jasinski/pymolish-studio"
Documentation = "https://github.com/adrian-jasinski/pymolish-studio/blob/master/docs/features.md"
Repository = "https://github.com/adrian-jasinski/pymolish-studio"
"Bug Tracker" = "https://github.com/adrian-jasinski/pymolish-studio/issues"
Changelog = "https://github.com/adrian-jasinski/pymolish-studio/blob/master/ChangeLog"

[project.scripts]
pymolish = "pymol:launch"

[tool.setuptools.packages.find]
where = ["modules"]

[tool.setuptools.package-data]
pmg_qt = ["forms/*.ui"]

