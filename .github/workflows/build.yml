name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-Linux:

    runs-on: ubuntu-22.04

    strategy:
      # one failing Python must not hide the result of the other
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    env:
      # compiler cache: an unchanged source file is not compiled again
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends install \
            catch2 \
            ccache \
            libfreetype6-dev \
            libglew-dev \
            libglm-dev \
            libmsgpack-dev \
            libnetcdf-dev \
            nlohmann-json3-dev \
            libpng-dev

    - uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-${{ runner.os }}-${{ matrix.python-version }}-${{ github.run_id }}
        restore-keys: ccache-${{ runner.os }}-${{ matrix.python-version }}-

    - name: Build
      # no build isolation: its temporary numpy path would change every
      # compiler command and so miss the cache
      run: |
        pip install --upgrade pip
        pip install 'cmake>=3.13.3' 'numpy>=2.0' 'setuptools>=77.0.3'
        pip wheel -v --no-build-isolation --no-deps -w dist --config-settings testing=True --config-settings json=True .
        pip install "$(ls dist/*.whl)[dev,chem,fix]"
        ccache -s
      env:
        # the 3.13 job ships the preview artifacts, so it is a release build
        DEBUG: ${{ matrix.python-version != '3.13' && '1' || '' }}

    - name: Test
      run: |
        pymolish -ckqy testing/testing.py --run all

    - name: Build standalone bundle
      if: matrix.python-version == '3.13'
      run: |
        pyinstaller --noconfirm packaging/pyinstaller.spec

    - name: Pack bundle
      if: matrix.python-version == '3.13'
      run: tar -C dist -czf dist/pymolish-${{ runner.os }}-${{ runner.arch }}.tar.gz pymolish

    - name: Upload preview artifacts
      if: matrix.python-version == '3.13'
      uses: actions/upload-artifact@v4
      with:
        name: pymolish-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        path: |
          dist/*.whl
          dist/pymolish-*.tar.gz
          dist/pymolish-*.zip
        if-no-files-found: error


  sanitize-Linux:
    # the suite under AddressSanitizer and UndefinedBehaviorSanitizer:
    # the safety net for docs/plans/08-cpp-modernization.md

    runs-on: ubuntu-22.04

    env:
      DEBUG: "1"
      # alignment is off: CGO keeps structs with pointers in a float buffer
      CXXFLAGS: -fsanitize=address,undefined -fno-sanitize=alignment -fno-sanitize-recover=undefined -fno-omit-frame-pointer
      CFLAGS: -fsanitize=address,undefined -fno-sanitize=alignment -fno-sanitize-recover=undefined -fno-omit-frame-pointer
      LDFLAGS: -fsanitize=address,undefined
      # Python itself does not free everything at exit
      ASAN_OPTIONS: detect_leaks=0
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends install \
            catch2 \
            ccache \
            libfreetype6-dev \
            libglew-dev \
            libglm-dev \
            libmsgpack-dev \
            libnetcdf-dev \
            nlohmann-json3-dev \
            libpng-dev

    - uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-sanitize-${{ github.run_id }}
        restore-keys: ccache-sanitize-

    - name: Build
      run: |
        pip install --upgrade pip
        pip install 'cmake>=3.13.3' 'numpy>=2.0' 'setuptools>=77.0.3'
        pip install -v --no-build-isolation --config-settings testing=True --config-settings json=True '.[dev]'
        ccache -s

    - name: Test
      # libstdc++ is preloaded too: python does not link it, and ASan aborts
      # on the first C++ exception (the Catch2 tests throw) if it cannot find
      # __cxa_throw when it starts
      run: |
        LD_PRELOAD="$(gcc -print-file-name=libasan.so) $(gcc -print-file-name=libstdc++.so)" pymolish -ckqy testing/testing.py --run all


  build-Windows:

    runs-on: windows-latest

    strategy:
      # one failing Python must not hide the result of the other
      fail-fast: false
      matrix:
        python: [py313, py314]

    steps:
    - uses: actions/checkout@v6

    - uses: prefix-dev/setup-pixi@v0.11.3
      with:
        environments: ${{ matrix.python }}
        locked: false
        cache: false

    - name: Build PyMOL
      run: |
        pixi run -e ${{ matrix.python }} pip wheel -v --no-deps -w dist --config-settings testing=True --config-settings json=True .
        $whl = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
        pixi run -e ${{ matrix.python }} pip install "$whl[dev,chem,fix]"

    - name: Test
      run: pixi run -e ${{ matrix.python }} pymolish -ckqy testing\testing.py --run all

    - name: Build standalone bundle
      if: matrix.python == 'py313'
      # conda-forge icu puts a copy of icuuc78.dll under the name of the ICU
      # of Windows, icuuc.dll, which only Qt6Core.dll imports. PyInstaller's
      # PySide6 hook imports QtCore without the workaround in pymol.Qt, fails
      # on that copy and then collects no Qt plugin: the bundle cannot open a
      # window. Removed after Test, which so still covers the workaround.
      run: |
        Remove-Item .pixi\envs\${{ matrix.python }}\Library\bin\icuuc.dll
        pixi run -e ${{ matrix.python }} pyinstaller --noconfirm packaging/pyinstaller.spec

    - name: Pack bundle
      if: matrix.python == 'py313'
      run: Compress-Archive -Path dist\pymolish -DestinationPath dist\pymolish-${{ runner.os }}-${{ runner.arch }}.zip

    - name: Upload preview artifacts
      if: matrix.python == 'py313'
      uses: actions/upload-artifact@v4
      with:
        name: pymolish-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        path: |
          dist/*.whl
          dist/pymolish-*.tar.gz
          dist/pymolish-*.zip
        if-no-files-found: error


  build-MacOS:

    runs-on: macos-latest

    strategy:
      # one failing Python must not hide the result of the other
      fail-fast: false
      matrix:
        python: [py313, py314]

    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
    - uses: actions/checkout@v6

    - uses: prefix-dev/setup-pixi@v0.11.3
      with:
        environments: ${{ matrix.python }}
        locked: false
        cache: false

    - run: brew install ccache

    - uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-${{ runner.os }}-${{ matrix.python }}-${{ github.run_id }}
        restore-keys: ccache-${{ runner.os }}-${{ matrix.python }}-

    - name: Build PyMOL
      run: |
        pixi run -e ${{ matrix.python }} pip install 'cmake>=3.13.3' 'numpy>=2.0' 'setuptools>=77.0.3'
        pixi run -e ${{ matrix.python }} pip wheel -v --no-build-isolation --no-deps -w dist --config-settings testing=True --config-settings json=True .
        pixi run -e ${{ matrix.python }} pip install "$(ls dist/*.whl)[dev,chem,fix]"
        ccache -s

    - name: Test
      run: pixi run -e ${{ matrix.python }} pymolish -ckqy testing/testing.py --run all

    - name: Build standalone bundle
      if: matrix.python == 'py313'
      run: pixi run -e ${{ matrix.python }} pyinstaller --noconfirm packaging/pyinstaller.spec

    - name: Pack bundle
      if: matrix.python == 'py313'
      run: tar -C dist -czf dist/pymolish-${{ runner.os }}-${{ runner.arch }}.tar.gz pymolish

    - name: Upload preview artifacts
      if: matrix.python == 'py313'
      uses: actions/upload-artifact@v4
      with:
        name: pymolish-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        path: |
          dist/*.whl
          dist/pymolish-*.tar.gz
          dist/pymolish-*.zip
        if-no-files-found: error


  release:
    # publish the three bundles when master changes; re-pushes with the same
    # version replace the files on the existing release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build-Linux, build-Windows, build-MacOS]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6

    - uses: actions/download-artifact@v4
      with:
        pattern: pymolish-*
        path: dist
        merge-multiple: true

    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tag=v$(sed -n 's/^#define _PyMOL_VERSION "\(.*\)"/\1/p' layer0/Version.h)
        # wording: docs/plans/10-readme-license.md
        notes=$(printf '%s\n\n' \
          "pymolish-studio. Based on PyMOL(TM) technology." \
          "Automated build of ${{ github.sha }}. Unsigned; see docs/plans/05-builds-binaries.md." \
          "pymolish-studio is an independent fork. It is not a Schrodinger product and is not affiliated with or endorsed by Schrodinger, LLC." \
          "PyMOL is a trademark of Schrodinger, LLC.")
        gh release view "$tag" >/dev/null 2>&1 \
          || gh release create "$tag" --prerelease --title "pymolish-studio $tag" --notes "$notes"
        (cd dist && sha256sum pymolish-*.tar.gz pymolish-*.zip *.whl > SHA256SUMS)
        gh release upload "$tag" --clobber dist/pymolish-*.tar.gz dist/pymolish-*.zip dist/*.whl dist/SHA256SUMS
